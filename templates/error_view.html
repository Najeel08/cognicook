{% extends "layout.html" %}
{% block content %}

<section class="glass-panel error-panel">
  <p class="eyebrow">Page Status</p>
  <div class="error-code">{{ status_code }}</div>
  <h1>{{ title }}</h1>
  <p class="lead-copy">{{ message }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-neon-primary">
    Go to Dashboard
  </a>
</section>

{% endblock %}
